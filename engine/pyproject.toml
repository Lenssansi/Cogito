[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cogito-engine"
version = "0.1.0"
description = "A from-scratch, framework-free AI agent engine: agent loop + tool system + provider abstraction."
authors = [{ name = "Lenssansi" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cogito_engine*"]
